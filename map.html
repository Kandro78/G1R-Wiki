<title>Interactive map – Gothic 1 Remake wiki</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@600&family=Noto+Serif:wght@400;700&display=swap">
<style>
:root { --bg: #0f1013; --panel: #18191d; --panel-2: #232529; --fg: #e6e1d9; --muted: #9d9891; --gold: #d6a947;
  --border: rgba(230,225,217,.18); --display: 'Grenze', Georgia, serif; --sans: 'Noto Serif', Georgia, serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--sans); }
body { display: flex; }
aside { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); height: 100%; }
aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
aside h1 { font: 600 1.6rem/1.1 var(--display); color: var(--gold); margin: 0 0 4px; }
a { color: var(--gold); }
aside header a { font-size: .85rem; }
#q { width: 100%; margin-top: 10px; padding: 7px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; font: inherit; }
#hits { list-style: none; margin: 6px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
#hits li { padding: 4px 6px; cursor: pointer; border-radius: 3px; }
#hits li:hover, #hits li:focus { background: var(--panel-2); outline: none; }
#hits small, .grp small, .lay small { color: var(--muted); }
#layers { overflow: auto; flex: 1; padding: 8px 10px 16px; }
details.lay { border-bottom: 1px solid var(--border); padding: 6px 0; }
details.lay summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-weight: 700; }
details.lay summary::-webkit-details-marker { display: none; }
details.lay summary::after { content: '▸'; margin-left: auto; color: var(--muted); }
details.lay[open] summary::after { content: '▾'; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1px solid rgba(0,0,0,.6); }
.grp { display: flex; align-items: center; gap: 8px; padding: 2px 0 2px 26px; cursor: pointer; }
.btns { display: flex; gap: 6px; padding: 4px 0 2px 26px; }
.btns button { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); border-radius: 3px; font: .8rem var(--sans); cursor: pointer; padding: 1px 8px; }
#map { flex: 1; height: 100%; background: #1a1712; }
#pos { position: absolute; right: 10px; bottom: 10px; z-index: 500; background: rgba(15,16,19,.85); padding: 3px 8px; border-radius: 3px; font: 12px monospace; color: var(--muted); pointer-events: none; }
#toggle { display: none; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
.leaflet-popup-content { font: 14px/1.4 var(--sans); margin: 10px 14px; }
.leaflet-popup-content b { font-size: 1.05em; }
.leaflet-popup-content small { color: var(--muted); display: block; }
.leaflet-container a { color: var(--gold); }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.place { background: none; border: none; }
.place span { display: inline-block; transform: translate(-50%, -50%); white-space: nowrap; font: 600 16px var(--display); color: #fff3d6;
  text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 10px #000; cursor: pointer; }
.far .place span { font-size: 12px; }
@media (max-width: 700px) {
  body { flex-direction: column; }
  aside { width: 100%; height: auto; max-height: 55vh; border-right: none; border-bottom: 1px solid var(--border); }
  aside.shut #layers, aside.shut #hits { display: none; }
  #toggle { display: inline; float: right; background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 3px; font: inherit; }
  #map { flex: 1; min-height: 45vh; }
}
</style>
</head>

      const row = document.createElement('label'); row.className = 'grp';
      row.innerHTML = `<input type="checkbox" checked> ${esc(g.name)} <small>${g.pts.length}</small>`;
      box = row.querySelector('input'); boxes.push(box); box.onchange = sync;
      d.appendChild(row);
    }
    g.fg = fg; g.box = box;
  });
  function sync() {
    lay.groups.forEach(g => { const on = master.checked && (!g.box || g.box.checked); on ? g.fg.addTo(map) : g.fg.remove(); });
  }
  master.onchange = sync;
  sync();
  side.appendChild(d);
});
zoomClass();
// search: every marker, shown layers or not; picking one turns its group on
const q = document.getElementById('q'), hits = document.getElementById('hits');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  hits.innerHTML = '';
  if (s.length < 2) return;
  const found = all.filter(a => a.p[2].toLowerCase().includes(s));
  found.slice(0, 60).forEach(a => {
    const li = document.createElement('li'); li.tabIndex = 0;
    li.innerHTML = `${esc(a.p[2])} <small>${esc(a.lay === a.grp ? a.lay : a.lay + ' · ' + a.grp)}${a.p[4] ? ' · ' + esc(a.p[4]) : ''}</small>`;
    li.onclick = li.onkeydown = e => {
      if (e.type === 'keydown' && e.key !== 'Enter') return;
      if (!map.hasLayer(a.fg)) a.fg.addTo(map);
      map.flyTo(ll(a.p), Math.max(map.getZoom(), 0.5), { duration: .6 });
      setTimeout(() => a.m.openPopup(), 650);
    };
    hits.appendChild(li);
  });
  if (found.length > 60) hits.insertAdjacentHTML('beforeend', `<li><small>${found.length - 60} more: type more letters</small></li>`);
  if (!found.length) hits.innerHTML = '<li><small>Nothing found</small></li>';
});
// world position under the mouse (the inverse of worldmap.frac in the wiki build)
const pos = document.getElementById('pos');
map.on('mousemove', e => {
  const fx = e.latlng.lng / W, fy = -e.latlng.lat / H;
  if (fx < 0 || fx > 1 || fy < 0 || fy > 1) { pos.textContent = ''; return; }
  pos.textContent = `x ${Math.round(227583 - fx * 1600 * 138.39)}  y ${Math.round(-45351 - fy * 900 * 131.92)}`;
});
const aside = document.getElementById('side');
document.getElementById('toggle').onclick = () => { aside.classList.toggle('shut'); map.invalidateSize(); };
if (matchMedia('(max-width: 700px)').matches) { aside.classList.add('shut'); map.invalidateSize(); map.fitBounds(bounds); }
</script>
